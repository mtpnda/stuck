name: Stuck
options:
  bundleIdPrefix: com.mtpnda
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Stuck:
    type: application
    platform: iOS
    sources:
      - path: Contexts/Sources
    info:
      path: Contexts/Info.plist
      properties:
        CFBundleDisplayName: Stuck
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: "Stuck uses Face ID to keep your cognitive contexts private and protected."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mtpnda.stuck
        DEVELOPMENT_TEAM: 3T5F877TAB
        CODE_SIGN_STYLE: Automatic



  StuckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ContextsTests
    dependencies:
      - target: Stuck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mtpnda.stuckTests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
